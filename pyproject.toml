[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "logbook"
version = "0.1.0"
description = "Pilot logbook: local dashboard and CLI tools for military conversions, ATP/medical tracking, career support and importing."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Mike Mattinson" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
logbook = "logbook.cli:main"

[tool.setuptools.packages.find]
include = ["logbook*"]

[tool.setuptools.package-data]
logbook = ["server/templates/*.html", "server/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
